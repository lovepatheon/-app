spring:
  application:
    name: vocab-app-backend

  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  profiles:
    active: local

server:
  port: 8080
  servlet:
    context-path: /api

app:
  security:
    jwt-secret: ${JWT_SECRET:local-development-secret-change-before-production-2026}
    access-token-seconds: 7200
    refresh-token-days: 30
    secure-cookie: ${SECURE_COOKIE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
