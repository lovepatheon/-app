spring:
  datasource:
    url: jdbc:mysql://localhost:3306/vocab_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${DB_USERNAME:vocab_user}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  demo:
    enabled: ${DEMO_DATA_ENABLED:true}
    password: ${DEMO_PASSWORD:123456}
